# Deploys the Worker to Cloudflare on every merge to main. This only updates the Worker
# (craft-website.<account>.workers.dev); the live site changes only when Showit embeds it.
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID      the studio's Cloudflare account
#   GOOGLE_SERVICE_ACCOUNT                           the craft-website service account's JSON key
#   SHEET_ID                                         from the responses sheet's URL
#   PHOTOS_FOLDER_ID                                 from the website-photos folder's URL (optional)
#   RESEND_API_KEY, ALERT_EMAIL                      a Resend sending key and who to email when the sheet and Arketa disagree (optional)
#   TRIO_GROTESK_WOFF2_BASE64                        the brand's sub-header font (licensed, so not in this repo)
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: KV namespace
        run: node scripts/ci/kv.mjs
      - name: Deploy
        run: npx --yes wrangler@4 deploy
      - name: Secrets
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PHOTOS_FOLDER_ID: ${{ secrets.PHOTOS_FOLDER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_ID PHOTOS_FOLDER_ID RESEND_API_KEY ALERT_EMAIL; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"; else echo "$name not set, skipped"; fi
          done
      - name: Fonts
        env:
          TRIO_GROTESK_WOFF2_BASE64: ${{ secrets.TRIO_GROTESK_WOFF2_BASE64 }}
        run: |
          npx --yes wrangler@4 kv key put --binding DATA --remote font:kk-topo --path fonts/kk-topo.woff2
          if [ -n "$TRIO_GROTESK_WOFF2_BASE64" ]; then
            printf '%s' "$TRIO_GROTESK_WOFF2_BASE64" | base64 -d > "$RUNNER_TEMP/trio.woff2"
            npx --yes wrangler@4 kv key put --binding DATA --remote font:trio-grotesk-bold --path "$RUNNER_TEMP/trio.woff2"
          fi
